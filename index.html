<!DOCTYPE html>
<html>
<head>
    <title>Dale's World</title>
    <style>
        body { margin: 0; background: #1b3022; color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #pet { position: absolute; width: 100px; cursor: grab; image-rendering: pixelated; z-index: 10; }
        #ui { position: fixed; top: 20px; left: 20px; pointer-events: none; text-shadow: 2px 2px black; }
        #update-panel { 
            position: fixed; bottom: 20px; right: 20px; 
            background: rgba(0,0,0,0.85); border: 2px solid #ffcc00;
            padding: 15px; border-radius: 10px; width: 280px; 
        }
        h3 { margin-top: 0; color: #ffcc00; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #ffcc00; padding-bottom: 5px; }
        #log-content { font-size: 13px; line-height: 1.5; color: #00ff00; }
        .stat { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="margin:0;">DALE</h1>
        <p>Size: <span id="size-val" class="stat">100</span>px</p>
        <p>Tosses: <span id="toss-val" class="stat">0</span></p>
    </div>

    <div id="update-panel">
        <h3>Recent Updates</h3>
        <div id="log-content"></div>
    </div>

    <img id="pet" src="https://openclipart.org/image/800px/216503" alt="Dale is loading...">

    <script>
        const pet = document.getElementById('pet');
        const sizeVal = document.getElementById('size-val');
        const tossVal = document.getElementById('toss-val');
        const log = document.getElementById('log-content');

        const updates = [
            "Dale is officially live!",
            "Toss tracker enabled!",
            "Testing visibility with a backup duck..."
        ];

        log.innerHTML = updates.map(line => `• ${line}`).join('<br>');

        let posX = 150, posY = 150, targetX = 150, targetY = 150, size = 100, tosses = 0;
        let isDragging = false;

        pet.onmousedown = () => { isDragging = true; };
        window.onmousemove = (e) => {
            if (isDragging) {
                posX = e.clientX - (size/2); posY = e.clientY - (size/2);
                targetX = posX; targetY = posY;
            }
        };
        window.onmouseup = () => { 
            if(isDragging) {
                isDragging = false; 
                size += 10; 
                tosses += 1;
                pet.style.width = size + 'px';
                sizeVal.innerText = size;
                tossVal.innerText = tosses;
            }
        };

        function frame() {
            if (!isDragging) {
                const dx = targetX - posX, dy = targetY - posY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 5) {
                    posX += dx * 0.05; posY += dy * 0.05;
                }
            }
            pet.style.left = posX + 'px'; pet.style.top = posY + 'px';
            requestAnimationFrame(frame);
        }

        setInterval(() => {
            if (!isDragging) {
                targetX = Math.random() * (window.innerWidth - size);
                targetY = Math.random() * (window.innerHeight - size);
            }
        }, 4000);

        frame();
    </script>
</body>
</html>
