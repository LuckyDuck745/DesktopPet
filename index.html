<!DOCTYPE html>
<html>
<head>
    <title>Dale's World</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #pet { position: absolute; width: 100px; cursor: grab; image-rendering: pixelated; transition: width 0.3s; z-index: 10; }
        #ui { position: fixed; top: 20px; left: 20px; pointer-events: none; text-shadow: 2px 2px black; }
        #update-panel { 
            position: fixed; bottom: 20px; right: 20px; 
            background: rgba(0,0,0,0.85); border: 2px solid #ffcc00;
            padding: 15px; border-radius: 10px; width: 280px; 
        }
        h3 { margin-top: 0; color: #ffcc00; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #ffcc00; padding-bottom: 5px; }
        #sheet-content { font-size: 13px; line-height: 1.5; color: #00ff00; }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="margin:0;">DALE</h1>
        <p>Size: <span id="size-val">100</span>px</p>
    </div>

    <div id="update-panel">
        <h3>Recent Updates</h3>
        <div id="sheet-content">Syncing with Dale's Brain...</div>
    </div>

    <img id="pet" src="kaczuha1.gif">

    <script>
        const pet = document.getElementById('pet');
        const sizeVal = document.getElementById('size-val');
        const log = document.getElementById('sheet-content');

        // I built the correct CSV link using your ID from the screenshot!
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQdORjnp7BDGsEvMp2PqGz96H4uV7ZL0jV5h8taez6p6QiqTR_W8w40-fcJeikp-vUJb3S6rvTPfyn/pub?output=csv";

        async function getUpdates() {
            try {
                const response = await fetch(sheetURL + "&t=" + Date.now());
                const data = await response.text();
                const lines = data.split(/\r?\n/).filter(l => l.trim() !== "");
                
                // This cleans the text and puts it on the screen
                log.innerHTML = lines.map(line => `• ${line.replace(/^"|"$/g, '')}`).join('<br>');
            } catch (e) {
                log.innerHTML = "• Update Dale's Google Sheet!<br>• Grow Dale by dragging him.";
            }
        }
        
        getUpdates();
        setInterval(getUpdates, 30000); // Check for new updates every 30 seconds

        // --- DALE MOVEMENT & GROWTH ---
        let posX = 150, posY = 150, targetX = 150, targetY = 150, size = 100;
        let isDragging = false;

        pet.onmousedown = () => { isDragging = true; };
        window.onmousemove = (e) => {
            if (isDragging) {
                posX = e.clientX - (size/2); posY = e.clientY - (size/2);
                targetX = posX; targetY = posY;
            }
        };
        window.onmouseup = () => { 
            isDragging = false; 
            size += 5; // Dale grows 5px every time you move him
            pet.style.width = size + 'px';
            sizeVal.innerText = size;
        };

        function frame() {
            if (!isDragging) {
                const dx = targetX - posX, dy = targetY - posY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 5) {
                    posX += dx * 0.05; posY += dy * 0.05;
                    pet.src = "kaczuha 2 1.png";
                    pet.style.transform = dx > 0 ? "scaleX(1)" : "scaleX(-1)";
                } else {
                    pet.src = "kaczuha1.gif";
                }
            }
            pet.style.left = posX + 'px'; pet.style.top = posY + 'px';
            requestAnimationFrame(frame);
        }

        setInterval(() => {
            if (!isDragging) {
                targetX = Math.random() * (window.innerWidth - size);
                targetY = Math.random() * (window.innerHeight - size);
            }
        }, 4000);

        frame();
    </script>
</body>
</html>
