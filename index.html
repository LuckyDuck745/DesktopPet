<!DOCTYPE html>
<html>
<head>
    <title>Dale the Duck</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; height: 100vh; }
        #pet {
            position: absolute;
            width: 100px;
            cursor: grab;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <img id="pet" src="kaczuha1.gif">

    <script>
        const pet = document.getElementById('pet');
        let posX = 100, posY = 100;
        let targetX = 100, targetY = 100;
        let isDragging = false;

        // 1. Drag logic
        pet.onmousedown = () => { isDragging = true; };
        window.onmousemove = (e) => {
            if (isDragging) {
                posX = e.clientX - 50;
                posY = e.clientY - 50;
                targetX = posX; 
                targetY = posY;
            }
        };
        window.onmouseup = () => { isDragging = false; };

        // 2. Movement logic
        function update() {
            if (!isDragging) {
                const distX = targetX - posX;
                const distY = targetY - posY;
                if (Math.abs(distX) > 5 || Math.abs(distY) > 5) {
                    posX += distX * 0.05;
                    posY += distY * 0.05;
                    pet.src = "kaczuha 2 1.png"; // Walking image
                    pet.style.transform = distX > 0 ? "scaleX(1)" : "scaleX(-1)";
                } else {
                    pet.src = "kaczuha1.gif"; // Resting GIF
                }
            }
            pet.style.left = posX + 'px';
            pet.style.top = posY + 'px';
            requestAnimationFrame(update);
        }

        // 3. Random wandering
        setInterval(() => {
            if (!isDragging) {
                targetX = Math.random() * (window.innerWidth - 100);
                targetY = Math.random() * (window.innerHeight - 100);
            }
        }, 3000);

        update();
    </script>
</body>
</html>
